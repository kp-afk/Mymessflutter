name: mymess_flutter
description: Mess management app
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shared_preferences: ^2.3.0
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase - Compatible versions
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.3.5
  cloud_firestore: ^5.5.2

  # Google Sign In - Compatible with firebase_auth
  google_sign_in: ^6.2.2

  # Utilities
  intl: ^0.20.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/menu.json